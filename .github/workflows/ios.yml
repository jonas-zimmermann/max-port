name: iOS ARM64 foundation
on:
  workflow_dispatch:
  pull_request:
    branches: [master, ios-port]
permissions:
  contents: read
jobs:
  iphone:
    # Free standard Intel runner; Xcode cross-compiles the iPhone ARM64 target.
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and CMake
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
      - name: Configure native device build
        run: cmake --preset ios-arm64
      - name: Build unsigned iPhone app
        run: cmake --build --preset ios-arm64 --parallel 3
      - name: Check bundle and ARM64 binary
        run: |
          test -d build/ios-arm64/Debug-iphoneos/max-port.app
          plutil -lint build/ios-arm64/Debug-iphoneos/max-port.app/Info.plist
          xcrun lipo -verify_arch arm64 build/ios-arm64/Debug-iphoneos/max-port.app/max-port
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' build/ios-arm64/Debug-iphoneos/max-port.app/Info.plist
      - name: Package development bundle
        run: ditto -c -k --keepParent build/ios-arm64/Debug-iphoneos/max-port.app build/ios-arm64/max-port-ios-arm64-unsigned.zip
      - name: Upload unsigned development bundle
        uses: actions/upload-artifact@v4
        with:
          name: max-port-ios-arm64-unsigned
          path: build/ios-arm64/max-port-ios-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 7
